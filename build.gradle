import compiler.NativeImage
import compiler.NativeImageTask
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
  id 'compiler.native-image'
  id 'com.gradleup.shadow' version '9.0.0'
  id 'com.palantir.git-version' version '1.0.0'
}

apply plugin: 'scala'
apply plugin: 'application'

repositories {
    mavenCentral()
}

def cliApps = [
    cdbmake: 'cdb.make',
    cdbdump: 'cdb.dump',
    cdbget : 'cdb.get'
]

ext {
    scala_maj = '3'
    scala_ver = "${scala_maj}.9.0"
    cliApps = cliApps
}

dependencies {
    implementation "org.scala-lang:scala3-library_${scala_maj}:${scala_ver}"
    implementation "org.scala-lang:scala3-compiler_${scala_maj}:${scala_ver}"

    testImplementation "org.scalatest:scalatest_${scala_maj}:3.2.20"
    testImplementation "org.scalactic:scalactic_${scala_maj}:3.2.20"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.scalatestplus:junit-4-13_${scala_maj}:3.2.20.0"
}

version = gitVersion()

application {
    mainClass.set('cdb.dump')
}

// Start scripts & distribution for all CLI apps
cliApps.each { appName, mainCls ->
    tasks.register("createStartScripts${appName.capitalize()}", CreateStartScripts) {
        applicationName = appName
        mainClass.set(mainCls)
        outputDir = file("${project.layout.buildDirectory.get().asFile}/scripts")
        classpath = tasks.named('jar').get().outputs.files + configurations.runtimeClasspath
    }

    tasks.register("run${appName.capitalize()}", JavaExec) {
        group = 'application'
        description = "Runs ${appName} on the JVM"
        mainClass.set(mainCls)
        classpath = sourceSets.main.runtimeClasspath
        standardInput = System.in
    }
}

tasks.named('startScripts').configure {
    dependsOn cliApps.keySet().collect { "createStartScripts${it.capitalize()}" }
}

distributions {
    main {
        contents {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            into('bin') {
                from("${project.layout.buildDirectory.get().asFile}/scripts")
            }
        }
    }
}

tasks.named('installDist').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE // allow duplicates
}

sourceSets {
    main {
        scala {
            srcDir 'src/main'
        }
        resources {
            srcDir 'src/main/resources'
            exclude '**/*.sample'
        }
    }
}

test {
    testLogging.showStandardStreams = true
    testLogging.exceptionFormat = 'full'
    minHeapSize = '2g'
    maxHeapSize = '6g'
}

task repl(type:JavaExec) {
    mainClass = 'scala.tools.nsc.MainGenericRunner'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    args '-usejavacp'
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = [
        '-feature'
      , '-Werror'
      , '-release'
      , '17'
    ]
}

// Shadow JAR configuration
shadowJar {
    manifest {
        attributes 'App-Version': version
    }
}

cliApps.each { appName, mainCls ->
    tasks.register("shadowJar${appName.capitalize()}", ShadowJar) {
        group = 'build'
        description = "Builds a standalone fat JAR for ${appName}"
        from sourceSets.main.output
        configurations = [project.configurations.runtimeClasspath]
        archiveBaseName.set(appName)
        archiveClassifier.set('all')
        manifest {
            attributes 'Main-Class': mainCls
            attributes 'App-Version': version
        }
    }
}

tasks.register('shadowJarAll') {
    group = 'build'
    description = 'Builds standalone fat JARs for all CLI apps'
    dependsOn cliApps.keySet().collect { "shadowJar${it.capitalize()}" }
}

// Native image configuration
nativeImage {
    dependsOn shadowJar
    jarFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })

    minHeap = 1
    maxHeap = 3
    maxNew = 3

    parameters = [
      NativeImage.Option.STATIC
    , NativeImage.Option.MUSL
    , NativeImage.Option.LINK_BUILD
    ]
}

cliApps.each { appName, mainCls ->
    def shadowTask = tasks.named("shadowJar${appName.capitalize()}")
    tasks.register("nativeImage${appName.capitalize()}", NativeImageTask) {
        group = 'verification'
        description = "Builds a native image for ${appName}"
        dependsOn shadowTask
        jarFile.set(shadowTask.flatMap { it.archiveFile })
        imageName.set(appName)
        minHeap.set(1)
        maxHeap.set(3)
        maxNew.set(3)
        parameters.set([
            NativeImage.Option.STATIC,
            NativeImage.Option.MUSL,
            NativeImage.Option.LINK_BUILD
        ])
    }
}

tasks.register('nativeImageAll') {
    group = 'verification'
    description = 'Builds native images for all CLI apps'
    dependsOn cliApps.keySet().collect { "nativeImage${it.capitalize()}" }
}

